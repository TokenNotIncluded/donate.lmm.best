<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0b">
  <meta name="description" content="">
  <title>Donate</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/coffee.css">
  <link rel="stylesheet" href="/style.css">
  <script defer src="/coffee.js"></script>
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip" href="#donation-form" data-i18n="skip">跳到捐赠</a>
  <div class="page">
    <header class="site-header">
      <div class="identity">
        <button id="logo" class="logo" type="button" aria-label="Donate"><pre class="coffee-logo" aria-hidden="true">   )  (&#32;&#32;&#32;&#32;
    (  )&#32;&#32;&#32;
  .----.&#32;&#32;&#32;
  |    |)&#32;&#32;
  '----'&#32;&#32;&#32;
 --------&#32;&#32;</pre></button>
        <h1 id="site-name">Donate</h1>
      </div>
      <label class="language-control"><span class="sr-only" data-i18n="language">语言</span><select id="language" aria-label="语言"><option value="zh-CN">简体中文</option><option value="zh-TW">繁體中文</option><option value="en">English</option></select><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></label>
    </header>
    <main>
      <div class="custom-copy" id="custom-copy" hidden><p id="site-tagline" hidden></p><p id="site-description" hidden></p></div>
      <section class="donation-sheet" aria-label="Donate">
        <form id="donation-form">
          <div class="amount-label"><label for="amount" data-i18n="amount">金额</label><label class="currency-control"><span class="sr-only" data-i18n="currency">币种</span><select id="currency" name="currency"></select><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></label></div>
          <div class="amount-entry"><span id="currency-symbol" aria-hidden="true">¥</span><input id="amount" name="amount" type="text" inputmode="decimal" autocomplete="off" value="15" maxlength="12" aria-describedby="amount-error" required></div>
          <p id="amount-error" class="field-error" role="alert" hidden></p>
          <div id="presets" class="presets" aria-label="预设金额"></div>
          <fieldset class="payment-choice"><legend data-i18n="paymentMethod">支付方式</legend><div id="payment-methods" class="payment-methods"><p class="empty-note" data-i18n="loading">正在加载…</p></div></fieldset>
          <details class="donor-details"><summary><span data-i18n="leaveNote">信息（选填）</span><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h12M10 4v12"/></svg></summary><div class="donor-fields" id="donor-fields">
            <label id="name-field"><span data-i18n="nameOptional">称呼</span><input name="name" id="donor-name" maxlength="120" autocomplete="name"></label>
            <label id="email-field"><span data-i18n="emailOptional">邮箱</span><input name="email" id="donor-email" type="email" maxlength="254" autocomplete="email"></label>
            <label id="message-field"><span data-i18n="messageOptional">留言</span><textarea name="message" id="donor-message" rows="2" maxlength="1000"></textarea></label>
            <label class="consent" id="public-consent-label"><input name="public" id="donor-public" type="checkbox"><span data-i18n="publicConsent">公开称呼和留言</span></label>
          </div></details>
          <p id="form-error" class="form-error" role="alert" hidden></p>
          <button class="donate-button" type="submit" id="donate-button"><span data-i18n="donate">捐赠</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg></button>
        </form>
        <section class="checkout-status" id="checkout-status" tabindex="-1" hidden aria-labelledby="checkout-title">
          <h2 id="checkout-title"></h2><p id="checkout-copy"></p><div class="checkout-amount" id="checkout-amount"></div>
          <div id="checkout-qr-container" hidden></div>
          <p id="checkout-instructions" class="instructions" hidden></p>
          <a id="checkout-link" class="donate-button" target="_blank" rel="noopener noreferrer" hidden><span data-i18n="openCheckout">前往支付</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 18 18 6M7 6h11v11"/></svg></a>
          <p class="status-detail" id="status-detail" role="status"></p>
          <div class="checkout-actions"><button id="status-refresh" class="text-link" type="button" data-i18n="checkPayment">查看状态</button><button id="new-donation" class="text-link" type="button" data-i18n="backDonate">返回</button></div>
        </section>
      </section>
      <section class="support-section" id="support-section" aria-label="捐赠" hidden><div id="recent-support" class="recent-support"></div></section>
    </main>
    <footer class="site-footer"><p id="site-footer-text" hidden></p><nav aria-label="Legal"><button class="text-link" type="button" data-policy="terms" data-i18n="terms">用户协议</button><button class="text-link" type="button" data-policy="privacy" data-i18n="privacy">隐私政策</button><a id="contact-link" class="text-link" hidden data-i18n="contact">联系</a><button id="donor-account-entry" class="text-link" type="button" aria-haspopup="dialog" aria-controls="donor-dialog">登录</button></nav></footer>
  </div>
  <dialog class="policy-dialog" id="policy-dialog"><div class="policy-header"><h2 id="policy-title"></h2><button type="button" id="close-policy" aria-label="关闭"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div id="policy-content"></div></dialog>
  <dialog class="policy-dialog donor-dialog" id="donor-dialog" aria-labelledby="donor-title">
    <div class="policy-header"><h2 id="donor-title">登录</h2><button type="button" id="close-donor" aria-label="关闭" autofocus><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
    <p id="donor-loading" class="account-feedback" role="status" hidden></p>
    <p id="donor-error" class="account-feedback account-error" role="alert" hidden></p>
    <p id="donor-status" class="account-feedback" role="status" hidden></p>
    <div id="donor-auth-actions" class="donor-auth-actions"><button id="donor-register" class="donor-button primary" type="button" data-i18n="createPasskey">创建 Passkey</button><button id="donor-login" class="donor-button" type="button" data-i18n="signIn">登录</button></div>
    <section id="donor-account" hidden>
      <div class="account-actions"><button id="donor-add-passkey" class="text-link" type="button" data-i18n="addPasskey">添加 Passkey</button><button id="donor-logout" class="text-link" type="button" data-i18n="signOut">退出</button></div>
      <h3 class="account-history-title" data-i18n="donationHistory">捐赠记录</h3>
      <div id="donor-history-list" class="account-history"></div>
      <p id="donor-history-empty" class="account-feedback" data-i18n="noHistory" hidden>暂无捐赠</p>
      <div class="account-pagination" id="donor-history-pagination" hidden><button type="button" id="donor-history-prev" class="text-link" data-i18n="previous">上一页</button><span id="donor-history-page"></span><button type="button" id="donor-history-next" class="text-link" data-i18n="next">下一页</button></div>
    </section>
  </dialog>
  <noscript><p class="noscript-note">请启用 JavaScript。Please enable JavaScript.</p></noscript>
</body>
</html>
